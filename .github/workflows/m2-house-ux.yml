name: M2 house editing UX
on:
  push:
    branches: [feat/m2-house-direct-ux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-mobile:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot and voxel extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content dependencies.lock.json -Raw | ConvertFrom-Json
          $root = Join-Path (Get-Location) '.tools/m2-house-ux'
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Content -LiteralPath (Join-Path (Split-Path $root) '.gdignore') -Value ''
          Invoke-WebRequest -Uri $lock.engine.editor_url -OutFile (Join-Path $root 'editor.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'editor.zip') -Algorithm SHA512).Hash.ToLowerInvariant() -ne $lock.engine.editor_sha512.ToLowerInvariant()) { throw 'Editor archive hash mismatch' }
          Invoke-WebRequest -Uri $lock.voxel.url -OutFile (Join-Path $root 'voxel.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'voxel.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.voxel.sha256.ToLowerInvariant()) { throw 'Voxel archive hash mismatch' }
          Expand-Archive -LiteralPath (Join-Path $root 'editor.zip') -DestinationPath $root -Force
          Expand-Archive -LiteralPath (Join-Path $root 'voxel.zip') -DestinationPath (Get-Location) -Force
          $editor = Get-ChildItem $root -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $editor) { throw 'Pinned Godot console editor missing' }
          if ((& $editor --version | Out-String).Trim() -ne $lock.engine.version) { throw 'Unexpected Godot version' }
          & $editor --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
      - name: Run targeted wall and section regressions
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/m2-house-ux' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          foreach ($test in @('m2_ground_wall_test','m2_section_edit_test','m2_house_edit_ux_test')) {
            $log = & $editor --headless --path . --script "tests/$test.gd" 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $log | Tee-Object -FilePath ".tools/m2-house-ux/$test.log"
            if ($exitCode -ne 0 -or $log -match 'ERROR:|Parse Error:|FAIL:' -or $log -notmatch 'failures=0|"failures"\s*:\s*0') { throw "UX test failed: $test" }
          }
      - name: Capture actual Mobile direct editing
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/m2-house-ux' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $out = Join-Path (Get-Location) '.tools/m2-house-ux/mobile.out.log'
          $err = Join-Path (Get-Location) '.tools/m2-house-ux/mobile.err.log'
          $arguments = @('--path', '.', '--rendering-method','mobile','--rendering-driver','d3d12','--audio-driver','Dummy','--max-fps','30','--script','tests/m2_house_edit_ux_test.gd','--','--require-rendering')
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'UX Mobile review timed out' }
          $log = (Get-Content $out -Raw) + (Get-Content $err -Raw)
          Write-Output $log
          if ($process.ExitCode -ne 0 -or $log -match 'ERROR:|FAIL:|Parse Error' -or $log -notmatch '"ok"\s*:\s*true' -or $log -notmatch '"captures"\s*:\s*4') { throw 'Mobile UX verification failed' }
      - name: Retain UX diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: house-ux-${{ github.sha }}
          path: |
            .tools/m2-house-ux/*.log
            .tools/cottage-repair/house-ux/
          if-no-files-found: warn
          retention-days: 14
