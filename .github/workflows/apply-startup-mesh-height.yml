name: Apply startup mesh height fix
on:
  push:
    branches: [task/test-maintenance-browser-watchdog]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'ci: apply startup mesh height fix')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact startup mesh height patch
        shell: python
        run: |
          from pathlib import Path

          backend = Path('scripts/terrain_backend.gd')
          text = backend.read_text(encoding='utf-8')
          replacements = [
              ('@export var startup_mesh_radius_world := 0.0\n', '@export var startup_mesh_radius_world := 0.0\n@export var startup_mesh_height_world := 0.0\n'),
              ('static func startup_mesh_area(size: Vector3i, scale: float, focus_world: Vector3, radius_world: float) -> AABB:\n', 'static func startup_mesh_area(size: Vector3i, scale: float, focus_world: Vector3, radius_world: float, height_world: float = 0.0) -> AABB:\n'),
              ('\tvar max_z := clampi(ceili(focus_cell.z + radius_cells), min_z + 1, size.z)\n\treturn AABB(Vector3(min_x, 0, min_z), Vector3(max_x - min_x, size.y, max_z - min_z))\n', '\tvar max_z := clampi(ceili(focus_cell.z + radius_cells), min_z + 1, size.z)\n\tvar max_y := size.y\n\tif height_world > 0.0 and is_finite(height_world):\n\t\tmax_y = clampi(ceili(height_world / scale), 1, size.y)\n\treturn AABB(Vector3(min_x, 0, min_z), Vector3(max_x - min_x, max_y, max_z - min_z))\n'),
              ('\treturn startup_mesh_area(patch_size, voxel_scale, startup_mesh_focus_world, startup_mesh_radius_world)\n', '\treturn startup_mesh_area(patch_size, voxel_scale, startup_mesh_focus_world, startup_mesh_radius_world, startup_mesh_height_world)\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one terrain backend match, got {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          backend.write_text(text, encoding='utf-8')

          scene = Path('scripts/m1_scene.gd')
          text = scene.read_text(encoding='utf-8')
          old = '\tbackend.set("startup_mesh_radius_world", 20.0)\n'
          new = '\tbackend.set("startup_mesh_radius_world", 20.0)\n\tbackend.set("startup_mesh_height_world", 16.0)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one m1 scene match, got {text.count(old)}')
          scene.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'Pali'
          git config user.email '31247276+palinalif@users.noreply.github.com'
          git rm .github/workflows/apply-startup-mesh-height.yml
          git add scripts/terrain_backend.gd scripts/m1_scene.gd
          git commit -m 'fix: bound startup mesh vertical band'
          git push origin HEAD:task/test-maintenance-browser-watchdog
