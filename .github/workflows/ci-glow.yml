name: M2 glow
on:
  push:
    branches: [feat/m2-vox-props]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glow-source:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot and voxel extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content dependencies.lock.json -Raw | ConvertFrom-Json
          $root = Join-Path (Get-Location) '.tools/glow'
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Content -LiteralPath (Join-Path (Split-Path $root) '.gdignore') -Value ''
          Invoke-WebRequest -Uri $lock.engine.editor_url -OutFile (Join-Path $root 'editor.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'editor.zip') -Algorithm SHA512).Hash.ToLowerInvariant() -ne $lock.engine.editor_sha512.ToLowerInvariant()) { throw 'Editor archive hash mismatch' }
          Invoke-WebRequest -Uri $lock.voxel.url -OutFile (Join-Path $root 'voxel.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'voxel.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.voxel.sha256.ToLowerInvariant()) { throw 'Voxel archive hash mismatch' }
          Expand-Archive -LiteralPath (Join-Path $root 'editor.zip') -DestinationPath $root -Force
          Expand-Archive -LiteralPath (Join-Path $root 'voxel.zip') -DestinationPath (Get-Location) -Force
          $editor = Get-ChildItem $root -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $editor) { throw 'Console editor missing' }
          if (-not (Test-Path -LiteralPath 'addons/zylann.voxel/bin/libvoxel.msvc.windows.release.x86_64.dll')) { throw 'Windows voxel extension missing' }
          $editor | ForEach-Object { $_.FullName } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Import project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_EDITOR --headless --path . --check-only --script res://scripts/m2_lantern_glow.gd
          if ($LASTEXITCODE) { throw 'Lantern glow script check failed' }
          & $env:GODOT_EDITOR --headless --path . --check-only --script res://scripts/m2_window_glow.gd
          if ($LASTEXITCODE) { throw 'Window glow script check failed' }
          & $env:GODOT_EDITOR --headless --path . --check-only --script res://scripts/m2_lantern_assets.gd
          if ($LASTEXITCODE) { throw 'Lantern asset script check failed' }
          & $env:GODOT_EDITOR --headless --path . --import
          if ($LASTEXITCODE) { throw 'Project import failed' }
      # The bake tool writes the OBJ into a Godot-visible staging directory:
      # Godot skips dot-directories, so a hidden staging dir imports the OBJ
      # into nothing and the .res it writes has no .import companion.
      # The bake tool writes the OBJ into a Godot-visible staging directory:
      # Godot skips dot-directories, so a hidden staging dir imports the OBJ
      # into nothing and the .res it writes has no .import companion.
      - name: Bake authored prop meshes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/magicavoxel | Out-Null
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_bench.vox build/magicavoxel/bench.obj build/magicavoxel/bench.res
          if ($LASTEXITCODE) { throw 'bench mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_hay_cart.vox build/magicavoxel/hay_cart.obj build/magicavoxel/hay_cart.res
          if ($LASTEXITCODE) { throw 'hay_cart mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_lamp_post.vox build/magicavoxel/lamp_post.obj build/magicavoxel/lamp_post.res
          if ($LASTEXITCODE) { throw 'lamp_post mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_market_cross.vox build/magicavoxel/market_cross.obj build/magicavoxel/market_cross.res
          if ($LASTEXITCODE) { throw 'market_cross mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_maypole.vox build/magicavoxel/maypole.obj build/magicavoxel/maypole.res
          if ($LASTEXITCODE) { throw 'maypole mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_notice_board.vox build/magicavoxel/notice_board.obj build/magicavoxel/notice_board.res
          if ($LASTEXITCODE) { throw 'notice_board mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_signpost.vox build/magicavoxel/signpost.obj build/magicavoxel/signpost.res
          if ($LASTEXITCODE) { throw 'signpost mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_stone_bench.vox build/magicavoxel/stone_bench.obj build/magicavoxel/stone_bench.res
          if ($LASTEXITCODE) { throw 'stone_bench mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . --script res://tools/magicavoxel/bake_mesh.gd res://assets/source/magicavoxel/hearthvale_water_pump.vox build/magicavoxel/water_pump.obj build/magicavoxel/water_pump.res
          if ($LASTEXITCODE) { throw 'water_pump mesh bake failed' }
          & $env:GODOT_EDITOR --headless --path . -e --import
          if ($LASTEXITCODE) { throw 'Post-bake import failed' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/bench.res.import')) { throw 'bench mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/hay_cart.res.import')) { throw 'hay_cart mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/lamp_post.res.import')) { throw 'lamp_post mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/market_cross.res.import')) { throw 'market_cross mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/maypole.res.import')) { throw 'maypole mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/notice_board.res.import')) { throw 'notice_board mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/signpost.res.import')) { throw 'signpost mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/stone_bench.res.import')) { throw 'stone_bench mesh was not imported' }
          if (-not (Test-Path -LiteralPath 'build/magicavoxel/water_pump.res.import')) { throw 'water_pump mesh was not imported' }
      - name: Run glow tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'res://tests/m2_lantern_glow_test.gd',
            'res://tests/m2_window_glow_test.gd',
            'res://tests/m2_starter_prop_assets_test.gd'
          )
          foreach ($test in $tests) {
            & $env:GODOT_EDITOR --headless --path . --script $test
            if ($LASTEXITCODE) { throw "$test failed" }
          }
