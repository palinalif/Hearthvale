name: M2 glow

on:
  workflow_dispatch:
  push:
    branches: [main, feat/m2-glow]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  glow:
    name: Glow lighting checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned voxel extension
        # The extension is gitignored, so a checkout without it exports an APK
        # that boots with no voxel terrain. Install it from the archive pinned
        # in dependencies.lock.json and verify the pinned checksum, exactly as
        # the M2 jobs do. The editor library is what headless import and export
        # load; the arm64 library is what the APK needs.
        run: |
          set -euo pipefail
          url=$(jq -r '.voxel.url' dependencies.lock.json)
          sha=$(jq -r '.voxel.sha256' dependencies.lock.json)
          echo "Fetching $url"
          curl -fsSL -o /tmp/voxel.zip "$url"
          echo "$sha  /tmp/voxel.zip" | sha256sum -c -
          # The pinned release is laid out exactly as the project expects:
          # addons/zylann.voxel/bin/libvoxel.<platform>.<editor|template_release>.<arch>.so,
          # and voxel.gdextension references those names directly.
          unzip -q -o /tmp/voxel.zip -d .
          test -f addons/zylann.voxel/bin/libvoxel.linux.editor.x86_64.so
          test -f addons/zylann.voxel/bin/libvoxel.android.template_release.arm64.so
          ls -l addons/zylann.voxel/bin | head -20

      - name: Install Godot
        # Pinned to the tag in dependencies.lock.json. The lock records the
        # Windows editor the desktop uses; the Linux headless build at the same
        # tag is the equivalent, so the suites run on the pinned engine version
        # rather than whatever the download endpoint currently serves.
        run: |
          set -euo pipefail
          TAG=$(jq -r '.engine.tag' dependencies.lock.json)
          # The release ships the Linux editor as a zip, not a bare binary.
          ZIP="Godot_v${TAG}_linux.x86_64.zip"
          BIN="Godot_v${TAG}_linux.x86_64"
          curl -sSfL -o godot_linux.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/${ZIP}"
          mkdir -p "$HOME/.local/share"
          unzip -q -o godot_linux.zip -d "$HOME/.local/share"
          test -f "$HOME/.local/share/$BIN"
          chmod +x "$HOME/.local/share/$BIN"
          echo "godot_bin=$HOME/.local/share/$BIN" >> "$GITHUB_ENV"
          "$HOME/.local/share/$BIN" --version

      - name: Import the project
        run: |
          set -euo pipefail
          "$godot_bin" --headless --path . --import

      - name: Verify the authored voxel sources
        run: |
          set -euo pipefail
          python3 tools/magicavoxel/author_furniture.py
          python3 tools/magicavoxel/author_props.py
          python3 tools/magicavoxel/author_tier_b.py
          # Every committed source must round-trip through the project's reader.
          for vox in assets/source/magicavoxel/*.vox; do
            python3 tools/magicavoxel/vox_to_obj.py "$vox" /tmp/check.obj --greedy >/dev/null
          done
          echo "all committed .vox sources parse"

      - name: Run the lighting test suites
        # Godot's --script exits non-zero when the script calls quit(1), so each
        # suite gates on its own exit code. The committed meshes are baked by
        # tools/magicavoxel/bake_all.sh and verified by the coverage test below;
        # rebaking them here would only prove the runner can write files that
        # are already committed.
        run: |
          set -euo pipefail
          for suite in \
            tests/magicavoxel_asset_test.gd \
            tests/m2_lantern_mesh_contract_test.gd \
            tests/m2_starter_furniture_mesh_test.gd \
            tests/m2_starter_prop_asset_test.gd \
            tests/visual_lighting_profile_test.gd \
            tests/m2_lantern_glow_test.gd \
            tests/m2_window_glow_test.gd \
            tests/m2_planter_placement_test.gd
          do
            echo "::group::${suite}"
            "$godot_bin" --headless --path . --script "res://${suite}"
            echo "::endgroup::"
          done

      # The ARM64 debug APK is built by the "Thor playtest APK" workflow on the
      # Windows runner: that runner has the Android SDK/JDK this Linux runner
      # lacks, and it already verifies package, signature, architecture and the
      # single libvoxel library. This job runs the test suite only.
