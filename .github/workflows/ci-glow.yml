name: M2 glow

on:
  workflow_dispatch:
  push:
    branches: [main, feat/m2-glow]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  glow:
    name: Glow lighting checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOXEL_VERSION: v1.7.1
      VOXEL_SHA256: 118e9b63d5bb2f6e45f0eff51d9023f6429cc05f877e2c45659354d692e60908
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the arm64 voxel extension
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/voxel.zip \
            "https://github.com/Coding-Works/GodotVoxelExtension/releases/download/${VOXEL_VERSION}/voxel-linux-template-release.zip"
          echo "${VOXEL_SHA256}  /tmp/voxel.zip" | sha256sum -c -
          unzip -q /tmp/voxel.zip -d /tmp/voxel
          find /tmp/voxel -name 'voxel.linux.arm64.so' -exec install -D -m755 {} addons/zylann.voxel/bin/voxel.linux.arm64.so \;
          test -s addons/zylann.voxel/bin/voxel.linux.arm64.so
      - name: Install Godot
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/godot.zip \
            "https://downloads.godotengine.org/?version=4.7&channel=stable&build=release&os=linux_x86_64"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import the project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import
      - name: Verify the authored voxel sources
        run: |
          set -euo pipefail
          python3 tools/magicavoxel/author_furniture.py
          python3 tools/magicavoxel/author_props.py
      - name: Bake the authored meshes
        run: |
          set -euo pipefail
          for src in assets/source/magicavoxel/hearthvale_furniture_*.vox assets/source/magicavoxel/hearthvale_prop_*.vox; do
            base=$(basename "$src" .vox)
            "$GODOT_BIN" --headless --path . --script res://tools/magicavoxel/bake_mesh.gd -- \
              "res://$src" "res://assets/models/magicavoxel/${base}.res"
          done
      - name: Verify the baked mesh contract
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/m2_starter_furniture_mesh_test.gd
      - name: Run the lighting test suites
        run: |
          set -euo pipefail
          for suite in tests/visual_lighting_profile_test.gd tests/m2_lantern_glow_test.gd tests/m2_window_glow_test.gd; do
            "$GODOT_BIN" --headless --path . --script "res://${suite}"
          done
