name: Apply startup mesh viewer headroom

on:
  push:
    branches:
      - task/test-maintenance-browser-watchdog

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Align cold-start readiness and viewer coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/terrain_backend.gd')
          s = p.read_text()
          marker = 'var terrain: Node\nvar voxels: Object\n'
          if marker not in s:
              raise SystemExit('backend member anchor missing')
          s = s.replace(marker, marker + 'var _startup_visual_viewer: Node3D\n', 1)

          old = '''\t\t\tvar visual_viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\t\tvisual_viewer.position = startup_mesh_focus_world\n\t\t\tvisual_viewer.view_distance = minf(64.0, startup_mesh_radius_world)\n\t\t\tadd_child(visual_viewer)\n'''
          new = '''\t\t\tvar visual_viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\t\tvisual_viewer.position = startup_mesh_focus_world\n\t\t\t# Readiness uses a smaller box than the viewer so mesh-block rounding\n\t\t\t# cannot leave an edge block required-but-never-requested. One native\n\t\t\t# mesh block is 4 world metres on the fine M1 grid.\n\t\t\tvisual_viewer.view_distance = minf(64.0, startup_mesh_radius_world + float(terrain.mesh_block_size) * voxel_scale)\n\t\t\t# Startup terrain occupies only the lower half of the valley. Avoid\n\t\t\t# cold-building empty upper mesh layers; restore full vertical range\n\t\t\t# after readiness.\n\t\t\tvisual_viewer.view_distance_vertical_ratio = 0.75\n\t\t\t_startup_visual_viewer = visual_viewer\n\t\t\tadd_child(visual_viewer)\n'''
          if old not in s:
              raise SystemExit('visual viewer block missing')
          s = s.replace(old, new, 1)

          old = '''\t_initial_mesh_ready = true\n\t_backend_ready = true\n\tready_changed.emit(true)\n\nstatic func startup_mesh_area'''
          new = '''\t_initial_mesh_ready = true\n\t_backend_ready = true\n\tready_changed.emit(true)\n\tif _startup_visual_viewer != null:\n\t\tcall_deferred("_expand_startup_visual_viewer")\n\nfunc _expand_startup_visual_viewer() -> void:\n\tif _startup_visual_viewer == null or not is_instance_valid(_startup_visual_viewer):\n\t\treturn\n\t_startup_visual_viewer.view_distance_vertical_ratio = 1.0\n\t_startup_visual_viewer.view_distance = 64.0\n\nstatic func startup_mesh_area'''
          if old not in s:
              raise SystemExit('ready anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('scripts/m1_scene.gd')
          s = p.read_text()
          old = 'backend.set("startup_mesh_radius_world", 16.0)'
          if old not in s:
              raise SystemExit('M1 radius missing')
          p.write_text(s.replace(old, 'backend.set("startup_mesh_radius_world", 12.0)', 1))

          p = Path('tests/m1_scaled_backend_test.gd')
          s = p.read_text()
          s = s.replace('var startup_radius_world := 16.0', 'var startup_radius_world := 12.0', 1)
          s = s.replace('startup mesh stays within thirty-two world units', 'startup mesh stays within thirty-two world units', 1)
          s = s.replace('is_equal_approx(float(visual_viewer.get("view_distance")), startup_radius_world), "visual voxel viewer only requests the bounded play radius"', 'is_equal_approx(float(visual_viewer.get("view_distance")), 16.0), "visual voxel viewer keeps one mesh block of startup headroom"', 1)
          insert = '\t\t\t_check(is_equal_approx(float(visual_viewer.get("view_distance_vertical_ratio")), 0.75), "visual voxel viewer limits cold-start vertical demand")\n'
          anchor = '\t\t\t_check(is_equal_approx(float(visual_viewer.get("view_distance")), 16.0), "visual voxel viewer keeps one mesh block of startup headroom")\n'
          if anchor not in s:
              raise SystemExit('test visual distance anchor missing')
          s = s.replace(anchor, anchor + insert, 1)
          p.write_text(s)
          PY
          rm .github/workflows/apply-startup-mesh-headroom.yml
          git config user.name 'Pali'
          git config user.email '31247276+palinalif@users.noreply.github.com'
          git add scripts/terrain_backend.gd scripts/m1_scene.gd tests/m1_scaled_backend_test.gd .github/workflows/apply-startup-mesh-headroom.yml
          git commit -m 'fix: align startup mesh readiness with viewer coverage'
          git push
