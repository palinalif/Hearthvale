name: Apply split voxel viewers

on:
  push:
    branches:
      - task/test-maintenance-browser-watchdog

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply split viewer architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/terrain_backend.gd')
          s = p.read_text()
          old = '''\tif ClassDB.class_exists("VoxelViewer"):\n\t\tvar viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\tvar viewer_focus := _world_size() * 0.5\n\t\tvar viewer_distance := 64.0\n\t\tif startup_mesh_radius_world > 0.0 and is_finite(startup_mesh_radius_world) and startup_mesh_focus_world.is_finite():\n\t\t\tviewer_focus = startup_mesh_focus_world\n\t\t\tviewer_distance = minf(64.0, startup_mesh_radius_world)\n\t\tviewer.position = viewer_focus\n\t\t# VoxelViewer view_distance is measured in world-space units. Keep cold\n\t\t# start demand aligned with the bounded startup readiness region.\n\t\tviewer.view_distance = viewer_distance\n\t\tadd_child(viewer)\n'''
          new = '''\tif ClassDB.class_exists("VoxelViewer"):\n\t\tvar bounded_startup := startup_mesh_radius_world > 0.0 and is_finite(startup_mesh_radius_world) and startup_mesh_focus_world.is_finite()\n\t\tif bounded_startup:\n\t\t\t# Keep all authoritative data resident so the complete finite valley can\n\t\t\t# become editable and receive the full deterministic paste, but do not\n\t\t\t# ask this viewer to build visuals/collisions for the entire map at boot.\n\t\t\tvar data_viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\t\tdata_viewer.position = _world_size() * 0.5\n\t\t\tdata_viewer.view_distance = 64.0\n\t\t\tdata_viewer.requires_visuals = false\n\t\t\tdata_viewer.requires_collisions = false\n\t\t\tadd_child(data_viewer)\n\n\t\t\t# Visual startup demand stays local to the initial cottage/play area.\n\t\t\tvar visual_viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\t\tvisual_viewer.position = startup_mesh_focus_world\n\t\t\tvisual_viewer.view_distance = minf(64.0, startup_mesh_radius_world)\n\t\t\tadd_child(visual_viewer)\n\t\telse:\n\t\t\tvar viewer: Node3D = ClassDB.instantiate("VoxelViewer")\n\t\t\tviewer.position = _world_size() * 0.5\n\t\t\tviewer.view_distance = 64.0\n\t\t\tadd_child(viewer)\n'''
          if old not in s:
              raise SystemExit('expected focused viewer block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/apply-split-voxel-viewers.yml
          git config user.name 'Pali'
          git config user.email '31247276+palinalif@users.noreply.github.com'
          git add scripts/terrain_backend.gd .github/workflows/apply-split-voxel-viewers.yml
          git commit -m 'fix: split terrain data and visual viewers'
          git push
