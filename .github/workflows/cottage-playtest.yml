name: Cottage playtest regressions
on:
  push:
    branches: [fix/m1-cottage-playtest-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cottage-playtest:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/cottage-repair | Out-Null
          Set-Content .tools/.gdignore ''
          git archive --format=zip --output=.tools/cottage-repair/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
      - name: Run existing M1 integration gates
        shell: pwsh
        run: ./tools/test-m1-placement.ps1
      - name: Test exported scene against Thor failures
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/m1-placement-ci' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $editor) { throw 'Pinned editor missing' }
          $tests = @('m1_cottage_targeting_playtest_test')
          if (Test-Path 'tests/m1_playtest_repair_test.gd') { $tests += 'm1_playtest_repair_test' }
          foreach ($test in $tests) {
            $output = & $editor --headless --max-fps 60 --quit-after 7200 --path . --script "tests/$test.gd" 2>&1 | ForEach-Object { "$_" }
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath ".tools/cottage-repair/$test.log"
            if ($exitCode -ne 0 -or ($output -match 'ERROR:|Parse Error:|FAIL:') -or -not (($output -join "`n") -match 'failures=0')) { throw "Cottage regression failed: $test" }
          }
      - name: Retain source and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cottage-repair-${{ github.sha }}
          path: .tools/cottage-repair/
          if-no-files-found: error
          retention-days: 14
