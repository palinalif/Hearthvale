name: Cottage playtest regressions

on:
  workflow_call:
    inputs:
      skip-core-placement:
        description: Compatibility input; core placement is already an independent caller prerequisite.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cottage-shards:
    name: cottage-${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard:
          - native-interaction
          - native-resize
          - native-visual
          - upper-openings
          - ui-style
          - detail-grid
          - fine-prop
          - foliage-halfsize
          - cottage-detail
          - home-variants
          - decoration-variants
          - paths
          - hamlet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Archive exact tracked source once
        if: matrix.shard == 'native-interaction'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/cottage-repair | Out-Null
          Set-Content .tools/.gdignore ''
          git archive --format=zip --output=.tools/cottage-repair/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

      - name: Run ${{ matrix.shard }} cottage shard
        shell: pwsh
        run: ./tools/test-cottage-shard.ps1 -Shard '${{ matrix.shard }}'

      - name: Retain shard diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cottage-${{ matrix.shard }}-${{ github.sha }}
          path: |
            .tools/cottage-repair/
            reports/screenshots/m1-cottage-detail/
            reports/screenshots/fine-prop-grid.png
            reports/screenshots/foliage-halfsize.png
            reports/screenshots/m2-home-catalogue/
            reports/screenshots/m2-paths/
            reports/screenshots/m2-hamlet/
          if-no-files-found: error
          retention-days: 14

  build-repair-apk:
    if: github.event_name != 'pull_request'
    needs: cottage-shards
    uses: ./.github/workflows/thor-repair-apk.yml
