name: Windows terrain remesh notification probe

on:
  push:
    branches:
      - task/test-maintenance-browser-watchdog

permissions:
  contents: read

jobs:
  terrain-nudge-probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Bootstrap pinned Godot and native dependencies
        shell: pwsh
        run: ./tools/bootstrap.ps1

      - name: Export Windows playtest
        shell: pwsh
        run: |
          ./tools/build.ps1 -WindowsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows playtest export failed' }

      - name: Launch terrain remesh notification probe
        shell: pwsh
        run: |
          $folder = (Resolve-Path 'builds/Hearthvale-M2-PC').Path
          $exe = Join-Path $folder 'Hearthvale.exe'
          $receipt = Join-Path $folder 'terrain-ready-nudge.json'
          $stdout = Join-Path $folder 'terrain-ready-nudge.stdout.log'
          $stderr = Join-Path $folder 'terrain-ready-nudge.stderr.log'
          $probeArg = '--terrain-ready-receipt=' + $receipt
          $process = Start-Process -FilePath $exe -ArgumentList @('--quit-after','120','--',$probeArg,'--terrain-diagnostic-nudge') -WorkingDirectory $folder -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $process.WaitForExit(100000)) {
            $process.Kill()
            $process.WaitForExit()
            Write-Output 'NUDGE_PROBE_PROCESS_TIMEOUT'
          }
          $runtimeLog = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Output $runtimeLog
          if (Test-Path $receipt) {
            $terrainRecord = Get-Content $receipt -Raw | ConvertFrom-Json
            Write-Output ('NUDGE_TERRAIN_RECEIPT ' + ($terrainRecord | ConvertTo-Json -Compress -Depth 12))
          } else {
            throw 'Terrain nudge readiness receipt was not created'
          }
          if ($runtimeLog -notmatch 'TERRAIN_RUNTIME_NUDGE') { throw 'Terrain nudge marker was not emitted' }

      - name: Upload terrain nudge diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-terrain-nudge-${{ github.sha }}
          path: |
            builds/Hearthvale-M2-PC/terrain-ready-nudge.json
            builds/Hearthvale-M2-PC/terrain-ready-nudge.*.log
          if-no-files-found: warn
          retention-days: 7
