name: Apply roof and perf cleanup
on:
  push:
    branches: [task/test-maintenance-browser-watchdog]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/test-maintenance-browser-watchdog
          fetch-depth: 0
      - name: Apply exact scoped fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('scripts/m2_scene_roof_design.gd'): [(
                  '\tsuper._ready()\n\t_install_roof_design_action()\n\t_build_roof_design_picker()\n',
                  '\tsuper._ready()\n\t# Roof shape is edited by interacting with the roof itself.\n\t_build_roof_design_picker()\n'
              )],
              Path('scripts/m2_scene_roof_accessories.gd'): [(
                  '\tsuper._ready()\n\t_install_roof_decor_action()\n\t_build_roof_decor_picker()\n',
                  '\tsuper._ready()\n\t# Roof accessories live in the roof catalogue/direct roof workflow, not Home Details.\n\t_build_roof_decor_picker()\n'
              )],
              Path('tests/m1_recovery_dpad_test.gd'): [(
                  '\tvar expected_rows := ["Duplicate", "House shape", "Wall colour", "Roof colour", "Roof design", "Roof decor", "Needs placement", "Close"]\n',
                  '\tvar expected_rows := ["Duplicate", "House shape", "Wall colour", "Roof colour", "Needs placement", "Close"]\n'
              )],
              Path('tests/m2_mobile_performance_guard.gd'): [(
                  '\t\tscene._open_build_browser("windows")\n\t\tawait _wait_frames(8)\n\t\tcheck(scene._browser_open, "build catalogue opens for benchmark")\n\t\t# Thumbnail generation is separately covered by rendered catalogue tests. Stop\n\t\t# it here so this normalized guard measures the open browser\'s steady-state cost.\n\t\tif scene._catalogue_thumbnails: scene._catalogue_thumbnails.stop()\n\t\tawait _wait_frames(2)\n',
                  '\t\tscene._open_build_browser("windows")\n\t\t# Thumbnail generation is separately covered by rendered catalogue tests. Stop\n\t\t# it before yielding a frame so the software renderer cannot start a thumbnail\n\t\t# render while this normalized guard measures only browser steady-state cost.\n\t\tif scene._catalogue_thumbnails: scene._catalogue_thumbnails.stop()\n\t\tawait _wait_frames(8)\n\t\tcheck(scene._browser_open, "build catalogue opens for benchmark")\n\t\tawait _wait_frames(2)\n'
              )],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exact block once, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
      - name: Verify changed file scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected=$'scripts/m2_scene_roof_accessories.gd\nscripts/m2_scene_roof_design.gd\ntests/m1_recovery_dpad_test.gd\ntests/m2_mobile_performance_guard.gd'
          test "$changed" = "$expected" || { echo "Unexpected changed files:"; echo "$changed"; exit 1; }
          git diff --check
          git diff
      - name: Commit scoped fixes and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/m2_scene_roof_accessories.gd scripts/m2_scene_roof_design.gd tests/m1_recovery_dpad_test.gd tests/m2_mobile_performance_guard.gd
          git commit -m "fix: keep roof controls out of home details"
          git rm .github/workflows/apply-roof-perf-cleanup.yml
          git commit -m "ci: remove roof perf patch helper"
          git push origin HEAD:task/test-maintenance-browser-watchdog
