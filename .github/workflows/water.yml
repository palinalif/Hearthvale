name: Water and landscape regressions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  water-native:
    name: water-regressions
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot and voxel extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content dependencies.lock.json -Raw | ConvertFrom-Json
          $root = Join-Path (Get-Location) '.tools/water'
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Content -LiteralPath (Join-Path $root '../.gdignore') -Value ''
          Invoke-WebRequest -Uri $lock.engine.editor_url -OutFile (Join-Path $root 'editor.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'editor.zip') -Algorithm SHA512).Hash.ToLowerInvariant() -ne $lock.engine.editor_sha512.ToLowerInvariant()) { throw 'Editor archive hash mismatch' }
          Invoke-WebRequest -Uri $lock.voxel.url -OutFile (Join-Path $root 'voxel.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'voxel.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.voxel.sha256.ToLowerInvariant()) { throw 'Voxel archive hash mismatch' }
          Expand-Archive -LiteralPath (Join-Path $root 'editor.zip') -DestinationPath $root -Force
          Expand-Archive -LiteralPath (Join-Path $root 'voxel.zip') -DestinationPath (Get-Location) -Force
          $editor = Get-ChildItem $root -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $editor) { throw 'Pinned Godot console editor missing' }
          if ((& $editor --version | Out-String).Trim() -ne $lock.engine.version) { throw 'Unexpected Godot version' }
          & $editor --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
      - name: Run water and landscape regressions
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/water' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          foreach ($test in @('water_region_test','water_carve_plan_test','water_visual_test','water_excavation_test','waterfall_test','waterfall_visual_test','water_lake_outline_test')) {
            $log = & $editor --headless --path . --script "tests/$test.gd" 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $log | Tee-Object -FilePath ".tools/water/$test.log"
            if ($exitCode -ne 0 -or $log -match 'SCRIPT ERROR|ERROR:|Parse Error:|FAIL:' -or $log -notmatch 'failures=0|"failures"\s*:\s*0') { throw "Water test failed: $test" }
          }
      - name: Retain water diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: water-${{ github.sha }}
          path: |
            .tools/water/*.log
          if-no-files-found: warn
          retention-days: 14
