name: M1 verified Drive delivery

on:
  push:
    branches: [master, feat/m1-ui-polish]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m unittest tests/upload_google_drive_test.py

  sculpt-feedback:
    uses: ./.github/workflows/sculpt-feedback.yml

  terrain-ux:
    uses: ./.github/workflows/terrain-ux.yml

  placement:
    uses: ./.github/workflows/m1-placement.yml

  cottage-and-apk:
    uses: ./.github/workflows/cottage-playtest.yml

  drive-delivery:
    name: Upload verified APK to private Google Drive
    needs: [delivery-contract, sculpt-feedback, terrain-ux, placement, cottage-and-apk]
    if: vars.GOOGLE_DRIVE_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download the verified APK and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hearthvale-m1-repair-${{ github.sha }}
          path: delivery
          merge-multiple: true

      - name: Revalidate artifact receipt
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $apk = Get-Item "delivery/hearthvale-m1-repair-$short.apk"
          $receipt = Get-Item "delivery/hearthvale-m1-repair-$short.verification.json"
          $record = Get-Content $receipt.FullName -Raw | ConvertFrom-Json
          $actual = (Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $record.ok -or $record.commit -ne $env:GITHUB_SHA -or $record.sha256 -ne $actual -or [int64]$record.bytes -ne $apk.Length) {
            throw 'Downloaded APK does not match its successful verification receipt'
          }

      - name: Ask Apps Script to copy the verified artifact to Drive
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          APPS_SCRIPT_WEBHOOK_SECRET: ${{ secrets.APPS_SCRIPT_WEBHOOK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/upload-google-drive.py --output delivery/drive-delivery.json

      - name: Record private Drive links
        shell: pwsh
        run: |
          $result = Get-Content delivery/drive-delivery.json -Raw | ConvertFrom-Json
          "### Private Google Drive delivery" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($file in $result.files) {
            "- [$($file.name)]($($file.url))" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          "- Commit: ``$env:GITHUB_SHA``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
