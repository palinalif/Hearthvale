name: Visual glow (lantern + window)
on:
  push:
    branches: [feat/m2-glow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glow-source:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot and voxel extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content dependencies.lock.json -Raw | ConvertFrom-Json
          $root = Join-Path (Get-Location) '.tools/glow'
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Content -LiteralPath (Join-Path (Split-Path $root) '.gdignore') -Value ''
          Invoke-WebRequest -Uri $lock.engine.editor_url -OutFile (Join-Path $root 'editor.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'editor.zip') -Algorithm SHA512).Hash.ToLowerInvariant() -ne $lock.engine.editor_sha512.ToLowerInvariant()) { throw 'Editor archive hash mismatch' }
          Invoke-WebRequest -Uri $lock.voxel.url -OutFile (Join-Path $root 'voxel.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $root 'voxel.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.voxel.sha256.ToLowerInvariant()) { throw 'Voxel archive hash mismatch' }
          Expand-Archive -LiteralPath (Join-Path $root 'editor.zip') -DestinationPath $root -Force
          Expand-Archive -LiteralPath (Join-Path $root 'voxel.zip') -DestinationPath (Get-Location) -Force
          $editor = Get-ChildItem $root -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $editor) { throw 'Pinned Godot console editor missing' }
          if ((& $editor --version | Out-String).Trim() -ne $lock.engine.version) { throw 'Unexpected Godot version' }
          $log = & $editor --headless --path . --editor --import --quit 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log | Tee-Object -FilePath "$root/import.log"
          if ($code -ne 0 -or $log -match 'SCRIPT ERROR|Parse Error|ERROR:') { throw 'Godot import failed' }
      - name: Verify lighting profile isolation
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/glow' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $log = & $editor --headless --path . --script tests/visual_lighting_profile_test.gd 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log | Tee-Object -FilePath '.tools/glow/profile.log'
          if ($code -ne 0 -or $log -match 'SCRIPT ERROR|Parse Error|ERROR:|FAIL:' -or $log -notmatch 'failures=0') { throw 'Profile regression failed' }
      - name: Verify path lantern glow
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/glow' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $log = & $editor --headless --path . --script tests/m2_lantern_glow_test.gd 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log | Tee-Object -FilePath '.tools/glow/lantern-glow.log'
          if ($code -ne 0 -or $log -match 'SCRIPT ERROR|Parse Error|ERROR:|FAIL:' -or $log -notmatch 'lantern glow checks passed') { throw 'Path lantern glow regression failed' }
      - name: Verify cottage window glow
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/glow' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $log = & $editor --headless --path . --script tests/m2_window_glow_test.gd 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log | Tee-Object -FilePath '.tools/glow/window-glow.log'
          if ($code -ne 0 -or $log -match 'SCRIPT ERROR|Parse Error|ERROR:|FAIL:') { throw 'Cottage window glow regression failed' }
          if ($log -notmatch 'window glow checks passed' -and $log -notmatch 'SKIP:') { throw 'Cottage window glow produced no verdict' }
      - name: Verify authored prop source contracts
        shell: pwsh
        run: |
          $editor = Get-ChildItem '.tools/glow' -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $failed = @()
          foreach ($test in @('magicavoxel_asset_test','m2_street_prop_asset_test','m2_obj_material_reference_test')) {
            $log = & $editor --headless --path . --script "tests/$test.gd" 2>&1 | Out-String
            $log | Tee-Object -FilePath ".tools/glow/$test.log"
            if ($LASTEXITCODE -ne 0 -or $log -match 'SCRIPT ERROR|Parse Error|ERROR:|FAIL:') { $failed += $test }
          }
          if ($failed.Count -gt 0) { throw ('Authored prop source checks failed: ' + ($failed -join ', ')) }
      - name: Retain glow logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-glow-${{ github.sha }}
          path: |
            .tools/glow/*.log
