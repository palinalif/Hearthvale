name: M1 attachment placement regressions
on:
  workflow_call:
  push:
    branches: [fix/m1-sculpt-feedback, fix/m1-building-edit-camera, fix/m1-window-layout, feat/m1-cottage-edit-ux, feat/m1-ui-ux-overhaul]
    paths:
      - scenes/m1.tscn
      - scripts/**
      - assets/ui/**
      - tests/**
      - tools/test-m1-placement.ps1
      - tools/test-roof-courses.ps1
      - tools/test-joined-roof-courses.ps1
      - tools/test-facade-depth.ps1
      - tools/test-m2-build-browser.ps1
      - .github/workflows/m1-placement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement-regressions:
    name: placement-${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - native
          - mobile-core
          - roof
          - joined-roof
          - facade
          - catalogue
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run ${{ matrix.suite }} placement shard
        shell: pwsh
        run: ./tools/test-m1-placement.ps1 -Suite '${{ matrix.suite }}'

      - name: Retain failed shard diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: placement-${{ matrix.suite }}-${{ github.sha }}
          path: |
            .tools/cottage-repair/
            reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7
