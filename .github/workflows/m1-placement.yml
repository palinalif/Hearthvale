name: M1 attachment placement regressions
on:
  workflow_call:
  push:
    branches: [fix/m1-sculpt-feedback, fix/m1-building-edit-camera, fix/m1-window-layout, feat/m1-cottage-edit-ux, feat/m1-ui-ux-overhaul]
    paths:
      - scenes/m1.tscn
      - scripts/m1_scene_placement.gd
      - scripts/m1_scene_terrain_ux.gd
      - scripts/m1_scene_building_camera.gd
      - scripts/m1_scene_cottage_ux.gd
      - scripts/m1_scene_cottage_style.gd
      - scripts/m1_scene_cottage_alignment.gd
      - scripts/m1_scene_cottage_resize_ux.gd
      - scripts/m1_scene_ui_overhaul.gd
      - scripts/m1_scene_tool_ui.gd
      - scripts/m1_scene_full_ui.gd
      - scripts/m1_scene_house_actions.gd
      - scripts/building_world.gd
      - scripts/cottage_resize_world.gd
      - scripts/building_placement_ghost.gd
      - scripts/ui/**
      - assets/ui/**
      - scripts/cottage_visual.gd
      - scripts/wall_attachment_placement.gd
      - scripts/detail_placement_ghost.gd
      - tests/wall_attachment_placement_test.gd
      - tests/m1_attachment_placement_test.gd
      - tests/m1_building_placement_test.gd
      - tests/m2_placement_rotation_test.gd
      - tests/m1_building_camera_test.gd
      - tests/m1_window_layout_test.gd
      - tests/m1_cottage_edit_ux_test.gd
      - tests/m1_ui_overhaul_test.gd
      - tests/m1_tool_ui_test.gd
      - tests/m1_full_ui_test.gd
      - tests/m1_ui_glyph_render_test.gd
      - tools/test-m1-placement.ps1
      - .github/workflows/m1-placement.yml
  pull_request:
    paths:
      - scenes/m1.tscn
      - scripts/m1_scene_placement.gd
      - scripts/m1_scene_terrain_ux.gd
      - scripts/m1_scene_building_camera.gd
      - scripts/m1_scene_cottage_ux.gd
      - scripts/m1_scene_cottage_style.gd
      - scripts/m1_scene_cottage_alignment.gd
      - scripts/m1_scene_cottage_resize_ux.gd
      - scripts/m1_scene_ui_overhaul.gd
      - scripts/m1_scene_tool_ui.gd
      - scripts/m1_scene_full_ui.gd
      - scripts/m1_scene_house_actions.gd
      - scripts/building_world.gd
      - scripts/cottage_resize_world.gd
      - scripts/building_placement_ghost.gd
      - scripts/ui/**
      - assets/ui/**
      - scripts/cottage_visual.gd
      - scripts/wall_attachment_placement.gd
      - scripts/detail_placement_ghost.gd
      - tests/wall_attachment_placement_test.gd
      - tests/m1_attachment_placement_test.gd
      - tests/m1_building_placement_test.gd
      - tests/m2_placement_rotation_test.gd
      - tests/m1_building_camera_test.gd
      - tests/m1_window_layout_test.gd
      - tests/m1_cottage_edit_ux_test.gd
      - tests/m1_ui_overhaul_test.gd
      - tests/m1_tool_ui_test.gd
      - tests/m1_full_ui_test.gd
      - tests/m1_ui_glyph_render_test.gd
      - tools/test-m1-placement.ps1
      - .github/workflows/m1-placement.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  placement-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked editor and native voxel extension; run placement tests
        shell: pwsh
        run: ./tools/test-m1-placement.ps1
