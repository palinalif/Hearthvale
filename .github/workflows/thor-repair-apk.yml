name: Verified isolated Thor repair APK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-thor-apk:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Bootstrap pinned Godot and native dependencies
        shell: pwsh
        run: ./tools/bootstrap.ps1

      - name: Configure Android export environment
        shell: pwsh
        run: |
          if ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME = $env:JAVA_HOME_17_X64 }
          if (-not $env:ANDROID_HOME) { throw 'ANDROID_HOME is unavailable on the runner' }
          if (-not (Test-Path "$env:ANDROID_HOME\platform-tools\adb.exe")) { throw 'Android SDK is incomplete' }
          if (-not (Test-Path "$env:JAVA_HOME\bin\keytool.exe")) { throw 'JDK 17 keytool is unavailable' }

          $keystoreDir = Join-Path $env:USERPROFILE '.android'
          $keystore = Join-Path $keystoreDir 'debug.keystore'
          New-Item -ItemType Directory -Force $keystoreDir | Out-Null
          if (-not (Test-Path $keystore)) {
            & "$env:JAVA_HOME\bin\keytool.exe" -genkeypair -v -keystore $keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -noprompt
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create ephemeral debug keystore' }
          }

          $env:GODOT_ANDROID_KEYSTORE_DEBUG_PATH = $keystore
          $env:GODOT_ANDROID_KEYSTORE_DEBUG_USER = 'androiddebugkey'
          $env:GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD = 'android'
          "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $godot = '.\.tools\godot-4.7.2\Godot_v4.7.2-stable_win64_console.exe'
          & $godot --headless --path . --editor --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot editor settings initialization failed' }
          $settings = Get-ChildItem (Join-Path $env:APPDATA 'Godot') -Filter 'editor_settings-*.tres' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $settings) { throw 'Godot editor settings file was not created' }
          $text = Get-Content $settings.FullName -Raw
          $sdk = $env:ANDROID_HOME.Replace('\','/')
          $jdk = $env:JAVA_HOME.Replace('\','/')
          foreach ($pair in @(@('export/android/android_sdk_path',$sdk), @('export/android/java_sdk_path',$jdk))) {
            $key = $pair[0]; $value = $pair[1]
            $pattern = '(?m)^' + [regex]::Escape($key) + '\s*=.*$'
            $line = $key + ' = "' + $value + '"'
            if ($text -match $pattern) { $text = [regex]::Replace($text, $pattern, $line) }
            else { $text += "`n$line`n" }
          }
          [IO.File]::WriteAllText($settings.FullName, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Set isolated candidate identity without changing the original app
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $file = Join-Path (Get-Location) 'export_presets.cfg'
          $text = Get-Content $file -Raw
          $text = $text.Replace('package/unique_name="org.hearthvale.game"', ('package/unique_name="org.hearthvale.game.repair.c' + $short + '"'))
          $text = $text.Replace('package/name="Hearthvale M1"', ('package/name="Hearthvale Test ' + $short + '"'))
          $text = [regex]::Replace($text, '(?m)^version/code=\d+', 'version/code=6')
          $text = [regex]::Replace($text, '(?m)^version/name="[^"]+"', ('version/name="0.1.3-repair-' + $short + '"'))
          [IO.File]::WriteAllText($file, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Import and export ARM64 debug APK
        shell: pwsh
        run: |
          $godot = '.\.tools\godot-4.7.2\Godot_v4.7.2-stable_win64_console.exe'
          & $godot --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          New-Item -ItemType Directory -Force builds | Out-Null
          $output = 'builds/hearthvale-m1-repair-' + $env:GITHUB_SHA.Substring(0, 8) + '.apk'
          $log = (& $godot --headless --path . --export-debug 'Android ARM64' $output 2>&1 | ForEach-Object { "$_" })
          $exit = $LASTEXITCODE
          $log | ForEach-Object { Write-Output $_ }
          $joined = $log -join "`n"
          if ($exit -ne 0 -or $joined -match 'SCRIPT ERROR:|ERROR:') { throw "Android export failed (exit=$exit)" }
          if (-not (Test-Path $output)) { throw 'APK was not created' }

      - name: Verify package, signature, Mobile renderer and pinned native library
        shell: pwsh
        run: |
          python ./tools/verify-repair-apk.py
          if ($LASTEXITCODE -ne 0) { throw 'Isolated repair APK verification failed' }

      - name: Upload verified repair APK and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hearthvale-m1-repair-${{ github.sha }}
          path: |
            builds/hearthvale-m1-repair-*.apk
            builds/hearthvale-m1-repair-*.verification.json
          if-no-files-found: error
          retention-days: 14
