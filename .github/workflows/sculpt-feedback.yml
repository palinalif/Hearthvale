name: Sculpt feedback regressions
on:
  push:
    branches: [fix/m1-sculpt-feedback]
  pull_request:
    paths:
      - scripts/terrain_backend.gd
      - scripts/smooth_neighbourhood.gd
      - tests/*sculpt*
      - tests/smooth_neighbourhood_test.gd
      - tools/test-sculpt-feedback.ps1
      - .github/workflows/sculpt-feedback.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked editor and native voxel extension; run headless tests
        shell: pwsh
        run: ./tools/test-sculpt-feedback.ps1
