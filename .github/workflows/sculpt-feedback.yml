name: Sculpt feedback regressions
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked editor and native voxel extension; run headless tests
        shell: pwsh
        run: ./tools/test-sculpt-feedback.ps1
